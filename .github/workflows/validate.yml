name: Validate submission

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: check that every required Part 1 document is present
  # ---------------------------------------------------------------------------
  structure:
    name: Check repository structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check docs folder
        run: |
          set -e
          fail=0

          check() {
            if [ -e "$1" ]; then
              echo "OK       $1"
            else
              echo "MISSING  $1  ($2)"
              fail=1
            fi
          }

          echo "== Required files =="
          check README.md                      "project README"
          check docs/api-endpoint-plan.md      "API endpoint plan"
          check docs/raceday_schema.sql        "SQL schema script"
          check docs/erd.dbml                  "ERD source"

          echo "== ERD image (PNG or PDF) =="
          if [ -e docs/erd.png ] || [ -e docs/erd.pdf ]; then
            ls -1 docs/erd.png docs/erd.pdf 2>/dev/null | sed 's/^/OK       /'
          else
            echo "MISSING  docs/erd.png or docs/erd.pdf"
            fail=1
          fi

          echo "== SQL file present in docs =="
          if ls docs/*.sql >/dev/null 2>&1; then
            ls -1 docs/*.sql | sed 's/^/OK       /'
          else
            echo "MISSING  docs/*.sql"
            fail=1
          fi

          exit $fail

      - name: Check README contains a YouTube link
        run: |
          if grep -Eiq 'https?://(www\.)?(youtube\.com/watch\?v=|youtu\.be/)[A-Za-z0-9_-]+' README.md; then
            echo "OK       README.md contains a YouTube link"
          else
            echo "MISSING  README.md has no YouTube link"
            exit 1
          fi

      - name: Check README sections
        run: |
          fail=0
          for heading in "ERD" "API" "SQL" "CI" "Video"; do
            if grep -qi "$heading" README.md; then
              echo "OK       README mentions '$heading'"
            else
              echo "MISSING  README does not mention '$heading'"
              fail=1
            fi
          done
          exit $fail

  # ---------------------------------------------------------------------------
  # Job 2: run the schema script against a real SQL Server to prove it executes
  #        cleanly on a fresh instance
  # ---------------------------------------------------------------------------
  sql:
    name: Run schema on SQL Server 2022
    runs-on: ubuntu-latest
    needs: structure
    env:
      SA_PASSWORD: "RaceDay_CI_P@ssw0rd!"

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "RaceDay_CI_P@ssw0rd!"
          MSSQL_PID: Developer
        ports:
          - 1433:1433

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for SQL Server to accept connections
        run: |
          for i in $(seq 1 30); do
            if docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd \
                 -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server is ready after $i attempt(s)"
              exit 0
            fi
            echo "Waiting for SQL Server... ($i)"
            sleep 3
          done
          echo "SQL Server did not become ready in time"
          docker logs ${{ job.services.mssql.id }} | tail -50
          exit 1

      - name: Run raceday_schema.sql (first run - fresh instance)
        run: |
          docker cp docs/raceday_schema.sql ${{ job.services.mssql.id }}:/tmp/raceday_schema.sql
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$SA_PASSWORD" -C -b -W \
            -i /tmp/raceday_schema.sql

      - name: Run raceday_schema.sql (second run - proves it is re-runnable)
        run: |
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$SA_PASSWORD" -C -b -W \
            -i /tmp/raceday_schema.sql > /dev/null
          echo "Second run completed without errors"

      - name: Verify tables and row counts
        run: |
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$SA_PASSWORD" -C -b -W -d RaceDay -Q "
              SET NOCOUNT ON;
              DECLARE @expected TABLE (TableName SYSNAME, MinRows INT);
              INSERT INTO @expected VALUES
                ('Roles', 2), ('EventTypes', 3), ('Users', 4), ('Events', 3),
                ('Categories', 3), ('Enrolments', 1), ('Results', 1);

              SELECT e.TableName, p.rows AS ActualRows, e.MinRows
              FROM @expected e
              LEFT JOIN sys.tables t ON t.name = e.TableName
              LEFT JOIN sys.partitions p ON p.object_id = t.object_id AND p.index_id IN (0, 1);

              IF EXISTS (
                SELECT 1 FROM @expected e
                LEFT JOIN sys.tables t ON t.name = e.TableName
                LEFT JOIN sys.partitions p ON p.object_id = t.object_id AND p.index_id IN (0, 1)
                WHERE t.object_id IS NULL OR p.rows < e.MinRows
              )
              BEGIN
                RAISERROR('A required table is missing or has too few seed rows.', 16, 1);
              END
            "
